# octosense-app-host — the smallest host an AppModule can run in: one
# window, one instance, no window manager. The shell (crate `octosense`)
# hosts modules in tiles with a launcher, a bus and a shade around them;
# this hosts exactly one module in its own window, so the same app crate
# ships as a standalone desktop app, a standalone mobile app, or a module
# linked into the shell, with no change to the app.
[package]
name = "octosense-app-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "A one-window host for a Makepad AppModule: the same app crate as a standalone app"

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }

# Standalone builds resolve the pinned sources from the prepared siblings,
# as the launcher workspace does; ignored when this crate is a dependency.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../../makepad/widgets" }
makepad-app-module = { path = "../../../makepad/libs/app_module" }
makepad-script = { path = "../../../makepad/platform/script" }
makepad-ai-services = { path = "../../../makepad/libs/ai/services" }
makepad-strict-json = { path = "../../../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../../../makepad/platform/studio" }
makepad-network = { path = "../../../makepad/platform/network" }
