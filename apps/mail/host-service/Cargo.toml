# octosense-mail-service — the `mail` host service (ADR 0004).
#
# Mail as a service the shell offers to contained apps: IMAP, and the POP3/SMTP code of
# the native Mail app, run on the host with the credentials the host holds.
# An app granted `mail` gets accounts, message lists, messages and a send;
# it never gets a socket or a password. Sign-in happens on a host-owned sheet,
# and passwords go to the keychain (Apple) or behind an Android Keystore key.
[package]
name = "octosense-mail-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
octosense-appstore = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "7180acfc2ffbc2577a6a2cc5faa83ab10c02696d" }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
mailparse = "0.16"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
scraper = { version = "0.24", default-features = false }
ego-tree = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "android")'.dependencies]
# The same crates makepad links, so there is one Java VM handle.
makepad-jni-sys = "0.4.0"
makepad-android-state = "0.1.0"
