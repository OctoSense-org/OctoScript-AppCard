[package]
name = "octosense-mail"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "1d3d383e84a66dbb18a4a860f505430c9d5b20f4" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "c4c9682219d5bb549856e35086adf1b354844dc3" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "c4c9682219d5bb549856e35086adf1b354844dc3" }
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "68f6a9df55692b5d8ef8873a12721e279a3f40d6" }
octoscript-node = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "c4c9682219d5bb549856e35086adf1b354844dc3" }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
mailparse = "0.16"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
scraper = { version = "0.24", default-features = false }
