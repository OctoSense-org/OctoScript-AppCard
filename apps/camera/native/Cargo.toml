[package]
name = "octosense-camera"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The Mate 70 Air camera app replicated as an in-process OctoSense AppModule: native Makepad L0 scenes built at runtime from the camera state over a live Makepad video-input preview"

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "57b31c9978635e51e633558131d1888d9ef4f45a" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "57b31c9978635e51e633558131d1888d9ef4f45a" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "36ad1f220ff74d0cbccd89d2b17769133b3fafd1" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "36ad1f220ff74d0cbccd89d2b17769133b3fafd1" }
octoscript-node = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "36ad1f220ff74d0cbccd89d2b17769133b3fafd1" }
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "68f6a9df55692b5d8ef8873a12721e279a3f40d6" }
serde = { version = "1", features = ["derive"] }
octosense-camera-logic = { path = "../logic" }
serde_json = "1"

# Standalone builds (cargo test here) resolve the pinned sources from the
# prepared siblings, as the launcher workspace does; ignored as a dependency.
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../../../makepad/widgets" }
makepad-app-module = { path = "../../../../makepad/libs/app_module" }
makepad-script = { path = "../../../../makepad/platform/script" }
makepad-ai-services = { path = "../../../../makepad/libs/ai/services" }
makepad-strict-json = { path = "../../../../makepad/libs/strict_json" }
makepad-studio-protocol = { path = "../../../../makepad/platform/studio" }
makepad-network = { path = "../../../../makepad/platform/network" }
[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-makepad = { path = "../../../../octoscript-makepad/crates/octoscript-makepad" }
octoscript-widgets = { path = "../../../../octoscript-makepad/crates/octoscript-widgets" }
octoscript-node = { path = "../../../../octoscript-makepad/crates/octoscript-node" }
[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-ui-l0 = { path = "../../../../octoscript/crates/octoscript-ui-l0" }
