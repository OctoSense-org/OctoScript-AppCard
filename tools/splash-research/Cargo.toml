[package]
name = "octos-one-splash-research-experiment"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "octos-one-splash-research-experiment"

[workspace]

[dependencies]
splash-capabilities = { path = "../../../octoscript/crates/splash-capabilities" }
splash-core = { path = "../../../octoscript/crates/splash-core" }
splash-schema = { path = "../../../octoscript/crates/splash-schema" }
splash-ui-l0 = { path = "../../../octoscript/crates/splash-ui-l0" }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rss = "2"
scraper = { version = "0.24", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
