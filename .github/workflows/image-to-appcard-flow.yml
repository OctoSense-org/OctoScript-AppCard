name: image-to-appcard-flow
on:
  push:
    paths: ['flows/image-to-card/**', 'flows/image-lib/**', 'flows/core/**', 'examples/aircon/image-to-appcard-flow.json', 'tools/image-to-appcard-flow.sh', 'tools/beauty-pipeline.sh', '.github/workflows/image-to-appcard-flow.yml']
  pull_request:
    paths: ['flows/image-to-card/**', 'flows/image-lib/**', 'flows/core/**', 'examples/aircon/image-to-appcard-flow.json', 'tools/image-to-appcard-flow.sh', 'tools/beauty-pipeline.sh', '.github/workflows/image-to-appcard-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r flows/image-lib/requirements.txt
      - run: python -m unittest discover -s flows/image-to-card -p 'test_*.py'
      - run: python -m unittest discover -s flows/image-to-card/wasm -p 'test_*.py'
