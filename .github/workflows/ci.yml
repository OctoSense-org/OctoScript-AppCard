name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS, not ubuntu: clippy runs makepad's build scripts, and the host
    # system-dependency set is only verified on macOS (what the dev machines
    # run). Ubuntu would need an untested apt package list for makepad's
    # Linux backend.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          path: octosense-org/Octosense-Service-AppCards
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare the shared Octoscript-Makepad runtime
        working-directory: octosense-org/Octosense-Service-AppCards
        run: python tools/setup-native.py --root ../

      - name: Runtime setup safeguards
        working-directory: octosense-org/Octosense-Service-AppCards
        run: PYTHONPATH=lab python -m unittest core.test_native_runtime

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # workspaces: octosense-org/Octosense-Service-AppCards/app — the workspace root (Cargo.toml) lives in app/;
      # without this the cache save fails with "could not find Cargo.toml"
      # and every run would compile cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: octos-one-app
          workspaces: octosense-org/Octosense-Service-AppCards/app

      # -p + --no-deps scopes the lint gate to this repo's own crates:
      # Makepad is the source locked by Octoscript-Makepad; its warnings are not
      # ours to gate (71 at last count), but they are still fully compiled
      # here — so this step is also the compile check for the whole app.
      - name: Clippy (own crates; shared runtime compiles)
        working-directory: octosense-org/Octosense-Service-AppCards/app
        run: cargo clippy -p octos-app -p octos-app-store -p octos-app-transport -p octos-app-render --all-targets --no-deps -- -D warnings

      - name: Verify one Makepad source in the app dependency graph
        working-directory: octosense-org/Octosense-Service-AppCards
        run: python tools/setup-native.py --check --root ../ --cargo-manifest app/Cargo.toml
