name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS, not ubuntu: clippy runs makepad's build scripts, and the host
    # system-dependency set is only verified on macOS (what the dev machines
    # run). Ubuntu would need an untested apt package list for makepad's
    # Linux backend.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          path: octosense-org/Octosense-Service-AppCards
          submodules: recursive

      # Independent sibling repositories, pinned to the app's git dependencies.
      - uses: actions/checkout@v6
        with:
          repository: OctoSense-org/Octoscript
          ref: e500e8da618729a64f47869dd0d1069d7ca18c34
          path: octosense-org/octoscript

      - uses: actions/checkout@v6
        with:
          repository: OctoSense-org/Octoscript-Makepad
          ref: 78f90f6e9e5e3b9fe4b5f5b0618fa4e93db30860
          path: octosense-org/octoscript-makepad

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # workspaces: octosense-org/Octosense-Service-AppCards/app — the workspace root (Cargo.toml) lives in app/;
      # without this the cache save fails with "could not find Cargo.toml"
      # and every run would compile cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: octos-one-app
          workspaces: octosense-org/Octosense-Service-AppCards/app

      # -p + --no-deps scopes the lint gate to this repo's own crates:
      # aichat/makepad are pinned third-party trees whose warnings are not
      # ours to gate (71 at last count), but they are still fully compiled
      # here — so this step is also the compile check for the whole app.
      - name: Clippy (own crates; makepad/aichat compile but don't lint)
        working-directory: octosense-org/Octosense-Service-AppCards/app
        run: cargo clippy -p octos-app -p octos-app-store -p octos-app-transport -p octos-app-render --all-targets --no-deps -- -D warnings
